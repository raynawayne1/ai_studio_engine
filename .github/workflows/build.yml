name: Cross-Platform Engine Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node & Python
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # ==========================================
    # 🐧 LINUX (UBUNTU) DEPENDENCY BOOTSTRAP
    # ==========================================
    - name: Provision Linux Dependencies
      if: matrix.os == 'ubuntu-24.04'
      run: |
        sudo apt update
        sudo apt install -y build-essential cmake ninja-build libopencv-dev
        python3 -m pip install opencv-python==4.9.0.80 "numpy<2"
        # Download ONNX Runtime Linux x64
        curl -L https://github.com/microsoft/onnxruntime/releases/download/v1.17.1/onnxruntime-linux-x64-1.17.1.tgz -o onnxruntime.tgz
        mkdir -p third_party/onnxruntime third_party/temp_ort
        tar -xzf onnxruntime.tgz -C third_party/temp_ort
        cp -r third_party/temp_ort/onnxruntime-linux-x64-1.17.1/* third_party/onnxruntime/
        rm -rf third_party/temp_ort onnxruntime.tgz

    # ==========================================
    # 🍏 MACOS DEPENDENCY BOOTSTRAP
    # ==========================================
    - name: Provision macOS Dependencies
      if: matrix.os == 'macos-14'
      run: |
        brew install ninja
        python3 -m pip install opencv-python==4.9.0.80 "numpy<2"
        # Set up OpenCV headers & ONNX Runtime using our robust python provisioning script
        python3 -c '
        import os, urllib.request, zipfile, tarfile, glob, shutil, ssl, platform, cv2
        ctx = ssl.create_default_context()
        ctx.check_hostname = False
        ctx.verify_mode = ssl.CERT_NONE

        # 1. OpenCV headers
        os.makedirs("third_party/opencv/include/opencv2", exist_ok=True)
        os.makedirs("third_party/opencv/lib", exist_ok=True)
        cv2_path = os.path.dirname(cv2.__file__)
        for file in os.listdir(cv2_path):
            if file.endswith(".dylib") or file.endswith(".so"):
                shutil.copy2(os.path.join(cv2_path, file), os.path.join("third_party/opencv/lib", file))

        url_cv = "https://github.com/opencv/opencv/archive/refs/tags/4.9.0.zip"
        req = urllib.request.Request(url_cv, headers={"User-Agent": "Mozilla/5.0"})
        with urllib.request.urlopen(req, context=ctx) as resp, open("opencv.zip", "wb") as f:
            shutil.copyfileobj(resp, f)
        os.makedirs("third_party/temp_cv", exist_ok=True)
        with zipfile.ZipFile("opencv.zip", "r") as z:
            z.extractall("third_party/temp_cv")
        
        extracted_root = "third_party/temp_cv/opencv-4.9.0"
        target_opencv2 = "third_party/opencv/include/opencv2"
        for mod in os.listdir(os.path.join(extracted_root, "modules")):
            mod_inc = os.path.join(extracted_root, "modules", mod, "include", "opencv2")
            if os.path.exists(mod_inc):
                for item in os.listdir(mod_inc):
                    s = os.path.join(mod_inc, item)
                    d = os.path.join(target_opencv2, item)
                    if os.path.isdir(s):
                        if os.path.exists(d): shutil.rmtree(d)
                        shutil.copytree(s, d)
                    else:
                        shutil.copy2(s, d)
        
        with open(os.path.join(target_opencv2, "opencv_modules.hpp"), "w") as f:
            f.write("#ifndef OPENCV_MODULES_HPP\n#define OPENCV_MODULES_HPP\n#define HAVE_OPENCV_CORE 1\n#define HAVE_OPENCV_IMGPROC 1\n#define HAVE_OPENCV_VIDEOIO 1\n#define HAVE_OPENCV_HIGHGUI 1\n#define HAVE_OPENCV_VIDEO 1\n#define HAVE_OPENCV_OBJDETECT 1\n#define HAVE_OPENCV_DNN 1\n#define HAVE_OPENCV_PHOTO 1\n#define HAVE_OPENCV_CALIB3D 1\n#define HAVE_OPENCV_FEATURES2D 1\n#define HAVE_OPENCV_ML 1\n#define HAVE_OPENCV_FLANN 1\n#define HAVE_OPENCV_STITCHING 1\n#endif\n")
        shutil.rmtree("third_party/temp_cv", ignore_errors=True)
        os.remove("opencv.zip")

        # 2. ONNX Runtime macOS
        arch = platform.machine()
        ort_file = "onnxruntime-osx-arm64-1.17.1.tgz" if arch == "arm64" else "onnxruntime-osx-x86_64-1.17.1.tgz"
        url_ort = f"https://github.com/microsoft/onnxruntime/releases/download/v1.17.1/{ort_file}"
        req_ort = urllib.request.Request(url_ort, headers={"User-Agent": "Mozilla/5.0"})
        with urllib.request.urlopen(req_ort, context=ctx) as resp, open("onnxruntime.tgz", "wb") as f:
            shutil.copyfileobj(resp, f)
        os.makedirs("third_party/onnxruntime", exist_ok=True)
        os.makedirs("third_party/temp_ort", exist_ok=True)
        with tarfile.open("onnxruntime.tgz", "r:gz") as tar:
            tar.extractall("third_party/temp_ort")
        extracted_ort = glob.glob("third_party/temp_ort/onnxruntime-*")[0]
        for item in os.listdir(extracted_ort):
            s = os.path.join(extracted_ort, item)
            d = os.path.join("third_party/onnxruntime", item)
            if os.path.exists(d):
                if os.path.isdir(d): shutil.rmtree(d)
                else: os.remove(d)
            shutil.move(s, d)
        shutil.rmtree("third_party/temp_ort", ignore_errors=True)
        os.remove("onnxruntime.tgz")
        print("SUCCESS: macOS CI dependencies bootstrapped!")
        '

    # ==========================================
    # 🪟 WINDOWS DEPENDENCY BOOTSTRAP
    # ==========================================
    - name: Provision Windows Dependencies
      if: matrix.os == 'windows-2022'
      run: |
        python -m pip install opencv-python==4.9.0.80 "numpy<2"
        powershell -Command "Invoke-WebRequest -Uri 'https://github.com/microsoft/onnxruntime/releases/download/v1.17.1/onnxruntime-win-x64-1.17.1.zip' -OutFile 'onnxruntime.zip'"
        powershell -Command "Expand-Archive -Path 'onnxruntime.zip' -DestinationPath 'third_party\temp_ort' -Force"
        New-Item -ItemType Directory -Force -Path "third_party\onnxruntime"
        $extracted = Get-ChildItem -Path "third_party\temp_ort\onnxruntime-win-x64-*" | Select-Object -First 1
        Move-Item -Path "$($extracted.FullName)\*" -Destination "third_party\onnxruntime\" -Force
        Remove-Item -Path "onnxruntime.zip", "third_party\temp_ort" -Recurse -Force
      shell: pwsh

    # ==========================================
    # 🔨 BUILD & SMOKE TEST
    # ==========================================
    - name: Configure CMake (Release Mode with Ninja)
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

    - name: Build Engine
      run: cmake --build build --config Release

    - name: Run Smoke Test (Windows)
      if: matrix.os == 'windows-2022'
      run: |
        cp third_party/onnxruntime/lib/onnxruntime.dll build/
        ./build/AIStudioEngine.exe --smoke-test
      shell: bash

    - name: Run Smoke Test (Unix)
      if: matrix.os != 'windows-2022'
      run: ./build/AIStudioEngine --smoke-test