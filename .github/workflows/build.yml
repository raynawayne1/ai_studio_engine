name: Cross-Platform Engine Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build Engine
      run: cmake --build build --config Release

    - name: Run Engine Binary (Windows)
      run: ./build/Release/AIStudioEngine
      if: runner.os == 'Windows'

    - name: Run Engine Binary (Unix)
      run: ./build/AIStudioEngine
      if: runner.os != 'Windows'