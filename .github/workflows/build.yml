name: Cross-Platform Engine Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node & Python
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # ==========================================
    # 🐧 LINUX (UBUNTU) DEPENDENCY BOOTSTRAP
    # ==========================================
    - name: Provision Linux Dependencies
      if: matrix.os == 'ubuntu-24.04'
      run: |
        sudo apt update
        sudo apt install -y build-essential cmake ninja-build libopencv-dev
        python3 -m pip install opencv-python==4.9.0.80 "numpy<2"
        
        mkdir -p third_party/opencv/include
        ln -s /usr/include/opencv4/opencv2 third_party/opencv/include/opencv2
        
        curl -L https://github.com/microsoft/onnxruntime/releases/download/v1.16.3/onnxruntime-linux-x64-1.16.3.tgz -o onnxruntime.tgz
        mkdir -p third_party/onnxruntime third_party/temp_ort
        tar -xzf onnxruntime.tgz -C third_party/temp_ort
        cp -r third_party/temp_ort/onnxruntime-linux-x64-1.16.3/* third_party/onnxruntime/
        rm -rf third_party/temp_ort onnxruntime.tgz

    # ==========================================
    # 🍏 MACOS DEPENDENCY BOOTSTRAP
    # ==========================================
    - name: Provision macOS Dependencies
      if: matrix.os == 'macos-14'
      run: |
        brew install ninja
        python3 -m pip install opencv-python==4.9.0.80 "numpy<2"
        
        cat << 'EOF' > prov_cv.py
        import os, urllib.request, zipfile, shutil, ssl, cv2
        ctx = ssl.create_default_context()
        ctx.check_hostname = False; ctx.verify_mode = ssl.CERT_NONE
        t_inc = "third_party/opencv/include/opencv2"
        t_lib = "third_party/opencv/lib"
        os.makedirs(t_inc, exist_ok=True)
        os.makedirs(t_lib, exist_ok=True)
        
        req = urllib.request.Request("https://github.com/opencv/opencv/archive/refs/tags/4.9.0.zip", headers={"User-Agent": "Mozilla/5.0"})
        with urllib.request.urlopen(req, context=ctx) as resp, open("cv.zip", "wb") as f:
            shutil.copyfileobj(resp, f)
        with zipfile.ZipFile("cv.zip", "r") as z:
            z.extractall("tmp_cv")
            
        shutil.copytree("tmp_cv/opencv-4.9.0/include/opencv2", t_inc, dirs_exist_ok=True)
        for mod in os.listdir("tmp_cv/opencv-4.9.0/modules"):
            m_inc = os.path.join("tmp_cv/opencv-4.9.0/modules", mod, "include", "opencv2")
            if os.path.exists(m_inc):
                shutil.copytree(m_inc, t_inc, dirs_exist_ok=True)
                
        with open(os.path.join(t_inc, "opencv_modules.hpp"), "w") as f:
            f.write("#ifndef OPENCV_MODULES_HPP\n#define OPENCV_MODULES_HPP\n#define HAVE_OPENCV_CORE 1\n#define HAVE_OPENCV_IMGPROC 1\n#define HAVE_OPENCV_VIDEOIO 1\n#define HAVE_OPENCV_HIGHGUI 1\n#define HAVE_OPENCV_VIDEO 1\n#define HAVE_OPENCV_OBJDETECT 1\n#define HAVE_OPENCV_DNN 1\n#define HAVE_OPENCV_PHOTO 1\n#define HAVE_OPENCV_CALIB3D 1\n#define HAVE_OPENCV_FEATURES2D 1\n#define HAVE_OPENCV_ML 1\n#define HAVE_OPENCV_FLANN 1\n#define HAVE_OPENCV_STITCHING 1\n#endif\n")
            
        shutil.rmtree("tmp_cv")
        os.remove("cv.zip")
        
        cv2_p = os.path.dirname(cv2.__file__)
        for f in os.listdir(cv2_p):
            if f.endswith((".so", ".dylib", ".pyd", ".dll")):
                shutil.copy2(os.path.join(cv2_p, f), t_lib)
        print("macOS OpenCV provisioned")
        EOF
        
        python3 prov_cv.py
        
        cat << 'EOF' > prov_ort.py
        import os, urllib.request, tarfile, glob, shutil, ssl, platform
        ctx = ssl.create_default_context()
        ctx.check_hostname = False; ctx.verify_mode = ssl.CERT_NONE
        arch = platform.machine()
        ort_file = "onnxruntime-osx-arm64-1.16.3.tgz" if arch == "arm64" else "onnxruntime-osx-x86_64-1.16.3.tgz"
        req = urllib.request.Request(f"https://github.com/microsoft/onnxruntime/releases/download/v1.16.3/{ort_file}", headers={"User-Agent": "Mozilla/5.0"})
        with urllib.request.urlopen(req, context=ctx) as resp, open("ort.tgz", "wb") as f:
            shutil.copyfileobj(resp, f)
        os.makedirs("third_party/onnxruntime", exist_ok=True)
        with tarfile.open("ort.tgz", "r:gz") as tar:
            tar.extractall("tmp_ort")
        ext = glob.glob("tmp_ort/onnxruntime-*")[0]
        for item in os.listdir(ext):
            shutil.move(os.path.join(ext, item), os.path.join("third_party/onnxruntime", item))
        shutil.rmtree("tmp_ort")
        os.remove("ort.tgz")
        print("macOS ONNX provisioned")
        EOF
        
        python3 prov_ort.py

    # ==========================================
    # 🪟 WINDOWS DEPENDENCY BOOTSTRAP (MSVC C++ SDK)
    # ==========================================
    - name: Provision Windows Dependencies
      if: matrix.os == 'windows-2022'
      run: |
        python -m pip install "numpy<2"
        
        $opencvUrl = "https://github.com/opencv/opencv/releases/download/4.9.0/opencv-4.9.0-windows.exe"
        Invoke-WebRequest -Uri $opencvUrl -OutFile "opencv_installer.exe"
        & "C:\Program Files\7-Zip\7z.exe" x opencv_installer.exe -o"third_party\opencv_extracted" -y
        
        New-Item -ItemType Directory -Force -Path "third_party\opencv\include"
        New-Item -ItemType Directory -Force -Path "third_party\opencv\lib"
        New-Item -ItemType Directory -Force -Path "third_party\opencv\bin"
        
        Copy-Item -Path "third_party\opencv_extracted\opencv\build\include\*" -Destination "third_party\opencv\include" -Recurse -Force
        Copy-Item -Path "third_party\opencv_extracted\opencv\build\x64\vc16\lib\*" -Destination "third_party\opencv\lib" -Force
        Copy-Item -Path "third_party\opencv_extracted\opencv\build\x64\vc16\bin\*" -Destination "third_party\opencv\bin" -Force
        
        Remove-Item -Path "opencv_installer.exe", "third_party\opencv_extracted" -Recurse -Force

        $ortUrl = "https://github.com/microsoft/onnxruntime/releases/download/v1.16.3/onnxruntime-win-x64-1.16.3.zip"
        Invoke-WebRequest -Uri $ortUrl -OutFile "onnxruntime.zip"
        Expand-Archive -Path "onnxruntime.zip" -DestinationPath "third_party\temp_ort" -Force
        New-Item -ItemType Directory -Force -Path "third_party\onnxruntime"
        $extracted = Get-ChildItem -Path "third_party\temp_ort\onnxruntime-win-x64-*" | Select-Object -First 1
        Move-Item -Path "$($extracted.FullName)\*" -Destination "third_party\onnxruntime\" -Force
        Remove-Item -Path "onnxruntime.zip", "third_party\temp_ort" -Recurse -Force
      shell: pwsh

    # ==========================================
    # 🔨 BUILD & SMOKE TEST
    # ==========================================
    - name: Enable MSVC on Windows
      if: matrix.os == 'windows-2022'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake (Unix)
      if: matrix.os != 'windows-2022'
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

    - name: Configure CMake (Windows)
      if: matrix.os == 'windows-2022'
      run: cmake -B build -G Ninja -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_BUILD_TYPE=Release

    - name: Build Engine
      run: cmake --build build --config Release

    - name: Run Smoke Test (Windows)
      if: matrix.os == 'windows-2022'
      run: |
        # Explicitly copy all required DLLs right next to the executable in build/
        Copy-Item "third_party\onnxruntime\bin\onnxruntime.dll" "build\" -Force
        Copy-Item "third_party\opencv\bin\*" "build\" -Force
        
        # Execute smoke test
        .\build\AIStudioEngine.exe --smoke-test
      shell: pwsh

    - name: Run Smoke Test (Unix)
      if: matrix.os != 'windows-2022'
      run: ./build/AIStudioEngine --smoke-test