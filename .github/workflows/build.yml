name: Cross-Platform Engine Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Configure CMake (Release Mode)
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build Engine (Ultra-Fast Parallel Compilation)
      run: cmake --build build --config Release --parallel

    - name: Run Engine Binary (Windows Smoke Test)
      run: ./build/Release/AIStudioEngine.exe
      if: runner.os == 'Windows'

    - name: Run Engine Binary (Unix Smoke Test)
      run: ./build/AIStudioEngine
      if: runner.os != 'Windows'